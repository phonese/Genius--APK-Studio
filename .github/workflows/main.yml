name: Genius APK Studio Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -name 'Genius_APK_Studio_v3_Complete.zip' -print -quit)
          test -n "$ZIP"
          unzip -q "$ZIP" -d extracted
          test -f extracted/Genius_APK_Studio/settings.gradle

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd extracted/Genius_APK_Studio
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Genius-APK-Studio-v3
          path: extracted/Genius_APK_Studio/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
