
name: Genius APK Studio Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Studio ZIP
        run: |
          unzip -q Genius_APK_Studio_Upgrade.zip -d extracted
          test -f extracted/genius_mvp/settings.gradle

      - name: Build Android APK
        run: |
          cd extracted/genius_mvp
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Genius-APK-Studio
          path: extracted/genius_mvp/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
