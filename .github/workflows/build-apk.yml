
name: Genius APK Studio Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'Genius_APK_Studio_MVP.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          unzip -o Genius_APK_Studio_MVP.zip -d project
          ls -la project

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Genius-APK-Studio
          path: project/app/build/outputs/apk/debug/*.apk
